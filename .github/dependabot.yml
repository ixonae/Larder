version: 2
updates:
  # Workflows pin actions by commit SHA with the version in a trailing comment
  # (`uses: owner/repo@<sha> # vX.Y.Z`). Dependabot bumps both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Base image pinned as `node:<tag>@sha256:<digest>`: Dependabot updates the digest as well.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    # Base image updates change the published image, so they cut a patch release.
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # Update Node release tags together with .nvmrc and package.json.
      - dependency-name: node
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]

  # pnpm workspace: dependencies are pinned to exact versions and the lockfile is updated with them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    # Runtime dependency bumps cut a patch release; dev-only bumps do not.
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope
    ignore:
      # Node types follow the Node major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
