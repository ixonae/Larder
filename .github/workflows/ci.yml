name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs the same checks before it tags a version.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so Release never cancels a push run.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main completes, including its Sonar analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      coverage-exclusions: ${{ steps.exclusions.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check Node version pins
        run: |
          pinned_node_version=$(cat .nvmrc)
          test "$(node --version)" = "v${pinned_node_version}"
          test "$(node -p "require('./package.json').engines.node")" = "$pinned_node_version"
          grep -qF "FROM node:${pinned_node_version}-trixie-slim@sha256:" docker/Dockerfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run tests with coverage
        run: |
          pnpm test:coverage
          test -s coverage/lcov.info
      - name: Read coverage exclusions from the Vitest config
        id: exclusions
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const { default: config } = await import("./vitest.config.ts");
            const list = config.test.coverage.exclude.filter((p) => !p.includes(".test.") && p !== "**/*.d.ts");
            appendFileSync(process.env.GITHUB_OUTPUT, `list=${["**/*.d.ts", ...list].join(",")}\n`);
          '
      - name: Keep the coverage report for SonarQube
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error
      - run: pnpm build

  # Analyses the coverage from `check` instead of running the tests again.
  sonarqube:
    name: SonarQube
    needs: check
    # Fork and Dependabot PRs run with restricted permissions; Release runs (workflow_dispatch) skip it.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: coverage
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          # Caches are immutable: a rolling key saves refreshed plugins, restore-keys reuses the latest.
          key: ${{ runner.os }}-sonar-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-sonar-
      - name: Authenticate to SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        with:
          project-key: ixonae_Larder
          export-env: false
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        with:
          args: -Dsonar.coverage.exclusions=${{ needs.check.outputs.coverage-exclusions }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build
      - name: Smoke-test the built image
        run: bash docker/smoke-test.sh
