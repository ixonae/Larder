sonar.projectKey=ixonae_Larder
sonar.organization=ixonae
sonar.projectName=Larder
sonar.sourceEncoding=UTF-8

sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,apps/web/src,packages/shared/src
# Tests live next to the code: keep the main and test sets disjoint.
sonar.exclusions=**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Coverage exclusions come from vitest.config.ts (see the sonarqube job in the CI workflow).
