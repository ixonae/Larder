sonar.projectKey=ixonae_Larder
sonar.organization=ixonae
sonar.projectName=Larder
sonar.sourceEncoding=UTF-8

# Vitest runs the test files and provides the coverage report below.
# Drizzle generates the migration snapshots and journal in migrations/meta.
